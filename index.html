<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content (estándar W3C): al abrir el teclado el
         navegador ENCOGE el área visible, así el input del chat (al final de un
         flex-column de 100dvh) queda justo encima del teclado en CUALQUIER teléfono,
         sin JS ni ajustes por dispositivo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>RETADOR</title>

    <!-- PWA: manifest + tema oscuro + íconos. Rutas relativas: la app vive en un
         subdirectorio de GitHub Pages (/Retador-Plataform-/). -->
    <!-- ?v=13: rompe la caché del manifest viejo (fullscreen) que el service worker
         antiguo servía al reinstalar; así la instalación SIEMPRE lee este manifest
         (standalone, con reloj y barra de estado visibles). -->
    <link rel="manifest" href="manifest.webmanifest?v=14" />
    <!-- Color inicial de las barras del sistema (pantalla de inicio, oscura).
         La app lo actualiza por JS en cada cambio de tema (claro/oscuro). -->
    <meta name="theme-color" content="#080808" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RETADOR" />
  </head>
  <body>
    <!-- Repintado del tema ANTES del primer frame visible, sin esperar a que
         cargue ni corra React: script SÍNCRONO (bloquea el parseo hasta
         terminar — nada de #root se pinta antes de que esto corra) que lee
         la preferencia real guardada (retador_theme) y fija html/body.style.
         backgroundColor + el meta theme-color YA. El CSS de index.css
         (prefers-color-scheme) cubre el instante ANTES incluso de que este
         script corra (o si falla); este script es el ajuste fino para
         cuando el usuario eligió un tema DISTINTO al del sistema. Sin esto,
         el primer repintado real dependía de un useEffect de React que solo
         corre DESPUÉS de montar — ese frame de por medio era la ventana real
         donde un redimensionado del sistema (p. ej. al armar la vista de
         apps recientes) podía "fotografiar" el color viejo. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("retador_theme") || "auto";
          var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = t === "auto" ? !!sysDark : t === "dark";
          var color = dark ? "#080808" : "#FFFFFF";
          document.documentElement.style.backgroundColor = color;
          document.body.style.backgroundColor = color;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", color);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

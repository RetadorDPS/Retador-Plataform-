<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conectando AliExpress…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080808;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .w{text-align:center;padding:24px;max-width:420px;}
  .s{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid #262626;border-top-color:#FFC01E;animation:g .8s linear infinite;}
  @keyframes g{to{transform:rotate(360deg);}}
  h1{font-size:17px;margin:0 0 8px;}
  p{font-size:13px;color:#888;margin:0;line-height:1.5;}
  .ok h1{color:#3ddc84;}
  .err h1{color:#ff6b6b;}
</style>
</head>
<body>
<div class="w" id="w">
  <div class="s" id="spinner"></div>
  <p id="msg">Conectando con AliExpress…</p>
</div>
<script>
  // GitHub Pages es hosting estático puro: esta página existe SOLO para que
  // la Callback URL real registrada en AliExpress
  // (https://retadormarketplace.es/aliexpress/callback) tenga algo que
  // servir. AliExpress redirige aquí el navegador de Daniel con "?code=..."
  // en la URL.
  //
  // BUG REAL corregido (causa raíz de verdad, con bytes reales confirmados):
  // antes esta página navegaba directo a la Edge Function
  // (location.replace) para que ESA respondiera el HTML final. Pero las
  // Edge Functions de Supabase reescriben cualquier Content-Type text/html
  // a text/plain (restricción de la plataforma, no un bug de esta app), y
  // sin un charset real declarado el navegador adivinaba mal la
  // codificación — de ahí "AutorizaciÃ³n" en vez de "Autorización". Los
  // bytes que mandaba la función SIEMPRE fueron UTF-8 correcto; el problema
  // era cómo el navegador los interpretaba al no confiar en el
  // Content-Type.
  //
  // Solución real: esta página (HTML de verdad, servida por GitHub Pages,
  // sin esa restricción) pide el resultado con fetch() en vez de navegar
  // hacia la función, y lo pinta ella misma con textContent. fetch()
  // decodifica el cuerpo SIEMPRE como UTF-8 por especificación (WHATWG
  // Fetch), sin importar qué Content-Type mande el servidor — así se evita
  // por completo la adivinanza de charset del navegador.
  var qs = location.search;
  var url = "https://qsxtjuhueqdxoduyroli.supabase.co/functions/v1/aliexpress-callback" + qs;

  fetch(url)
    .then(function (res) { return res.json().then(function (data) { return { status: res.status, data: data }; }); })
    .then(function (r) {
      var data = r.data || {};
      pintar(Boolean(data.ok), data.titulo || (data.ok ? "Listo" : "Ocurrió un error"), data.mensaje || "");
    })
    .catch(function () {
      pintar(false, "No se pudo conectar con RETADOR", "Revisa tu conexión e inténtalo de nuevo abriendo el enlace de autorización otra vez.");
    });

  function pintar(ok, titulo, mensaje) {
    var w = document.getElementById("w");
    w.className = ok ? "ok" : "err";
    document.getElementById("spinner").style.display = "none";
    var h1 = document.createElement("h1");
    h1.textContent = titulo;
    var p = document.getElementById("msg");
    p.textContent = mensaje;
    w.insertBefore(h1, p);
  }
</script>
</body>
</html>
